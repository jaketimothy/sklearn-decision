[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sklearn-decision"
dynamic = ["version"]
description = "Decision models (Jev and open-weights LLMs) as scikit-learn estimators and featurizers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jake Timothy" }]
keywords = ["scikit-learn", "machine-learning", "llm", "zero-shot", "feature-extraction", "jev"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Lower bounds are exercised by the "minimum versions" CI job.
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.6",
    "httpx>=0.25",
]

[project.optional-dependencies]
local = ["torch>=2.2", "transformers>=4.45"]
dev = ["pytest>=7", "pandas>=2", "ruff>=0.5"]
docs = ["sphinx>=7", "pydata-sphinx-theme>=0.15", "myst-parser>=3", "numpydoc>=1.7", "sphinx-gallery>=0.17", "matplotlib>=3.7", "pandas>=2"]

[project.urls]
Homepage = "https://github.com/jaketimothy/sklearn-decision"
Documentation = "https://jaketimothy.github.io/sklearn-decision/"
Issues = "https://github.com/jaketimothy/sklearn-decision/issues"
Changelog = "https://github.com/jaketimothy/sklearn-decision/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/sklearn_decision/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sklearn_decision"]

[tool.hatch.build.targets.sdist]
# benchmarks/ (answer caches, results) stays in the repo, out of the package
include = ["src", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the real Jev API (needs TYPESAFE_API_KEY)",
    "hub: downloads a real model from the Hugging Face Hub",
]
addopts = "-m 'not live and not hub'"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]  # zip(strict=) is noise for same-length row/answer pairs

[tool.ruff.lint.per-file-ignores]
# gallery examples import per section, so each step reads on its own
"examples/*" = ["E402"]
